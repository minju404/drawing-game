<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노설치 멀티 드로잉 게임</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f7f6; margin: 0; padding: 20px; }
        .screen { display: none; background: white; max-width: 550px; margin: 0 auto; padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .active { display: block; }
        canvas { border: 2px solid #333; background: white; cursor: crosshair; border-radius: 10px; touch-action: none; }
        .timer { font-size: 26px; font-weight: bold; color: #e74c3c; margin: 10px 0; }
        .word { font-size: 28px; color: #2ecc71; font-weight: bold; margin: 10px 0; }
        .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 15px; }
        .card { border: 3px solid #eee; padding: 10px; border-radius: 10px; cursor: pointer; background: #fff; transition: 0.2s; }
        .card:hover { border-color: #3498db; }
        .card img { width: 140px; height: 140px; background: #fafafa; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input { padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .room-code { background: #eef2f5; padding: 10px; border-radius: 8px; font-weight: bold; letter-spacing: 2px; font-size: 20px; word-break: break-all; margin: 10px 0; }
    </style>
</head>
<body>

    <!-- 1. 대기실 -->
    <div id="lobby-screen" class="screen active">
        <h1>🎨 멀티 캐치 드로잉</h1>
        <p>설치 없이 브라우저에서 바로 즐기는 게임</p>
        
        <div id="lobby-inputs">
            <input type="text" id="nickname" placeholder="닉네임 입력"><br><br>
            <button id="create-btn" onclick="createRoom()">방 만들기 (방장)</button>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <input type="text" id="join-code" placeholder="6자리 방 코드 입력" maxlength="6" style="text-transform:uppercase;">
            <button id="join-btn" onclick="joinRoom()">참여하기</button>
        </div>

        <div id="room-info" style="display:none; margin-top: 20px;">
            <p id="room-code-label">친구에게 아래 코드를 전달하세요:</p>
            <div class="room-code" id="display-code"></div>
            <h3>참여 유저 목록</h3>
            <ul id="player-list" style="list-style:none; padding:0; font-size:18px;"></ul>
            <br>
            <button id="start-btn" onclick="hostStartGame()" style="display:none; background:#2ecc71;">게임 시작 (8라운드)</button>
        </div>
    </div>

    <!-- 2. 그림 그리기 -->
    <div id="draw-screen" class="screen">
        <h2 id="round-info">1 / 8 라운드</h2>
        <div class="timer">남은 시간: <span id="draw-timer">30</span>초</div>
        <div class="word">제시어: <span id="target-word">?</span></div>
        <canvas id="canvas" width="300" height="300"></canvas><br><br>
        <button onclick="clearCanvas()">지우기</button>
    </div>

    <!-- 3. 투표 -->
    <div id="vote-screen" class="screen">
        <h2>마음에 드는 그림에 투표하세요!</h2>
        <div class="timer">남은 시간: <span id="vote-timer">15</span>초</div>
        <div id="drawing-grid" class="grid"></div>
    </div>

    <!-- 4. 라운드 결과 -->
    <div id="result-screen" class="screen">
        <h2>라운드 결과</h2>
        <h3 id="winner-text" style="color: #e67e22;"></h3>
        <h3>현재 순위</h3>
        <ul id="score-board" style="list-style:none; padding:0;"></ul>
    </div>

    <!-- 5. 최종 승리 -->
    <div id="end-screen" class="screen">
        <h1>🏆 최종 결과 🏆</h1>
        <ul id="final-board" style="list-style:none; padding:0; font-size:20px;"></ul>
        <button onclick="location.reload()">처음으로</button>
    </div>

    <script>
        const WORDS = ['사과', '바나나', '호랑이', '자동차', '비행기', '피자', '컴퓨터', '우주선', '안경', '축구공', '선글라스', '고양이'];
        let peer = null;
        let isHost = false;
        let myId = '';
        let myName = '';
        let hostConn = null;
        let conns = [];

        let players = {};
        let currentRound = 0;
        let currentWord = '';
        let timerInterval = null;

        function generate6DigitCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function resetPeer() {
            if (peer) {
                peer.destroy();
                peer = null;
            }
            conns = [];
            players = {};
        }

        function toggleButtons(disabled) {
            document.getElementById('create-btn').disabled = disabled;
            document.getElementById('join-btn').disabled = disabled;
        }

        // --- 방 만들기 (Host) ---
        function createRoom() {
            myName = document.getElementById('nickname').value.trim();
            if (!myName) return alert('닉네임을 입력하세요.');

            toggleButtons(true);
            resetPeer();
            isHost = true;
            
            // PeerJS 서버 옵션 추가로 안정성 확보
            const roomCode = generate6DigitCode();
            peer = new Peer(roomCode, { debug: 1 });

            peer.on('open', (id) => {
                myId = id;
                players[myId] = { name: myName, score: 0, drawing: null, votedFor: null };
                
                document.getElementById('lobby-inputs').style.display = 'none';
                document.getElementById('display-code').innerText = id;
                document.getElementById('room-info').style.display = 'block';
                document.getElementById('start-btn').style.display = 'inline-block';
                updateLobbyUI();
            });

            peer.on('connection', (conn) => {
                conn.on('open', () => {
                    conns.push(conn);
                });
                
                conn.on('data', (data) => handleHostData(conn, data));
                
                conn.on('close', () => {
                    delete players[conn.peer];
                    conns = conns.filter(c => c.peer !== conn.peer);
                    broadcast({ type: 'LOBBY_UPDATE', players });
                    updateLobbyUI();
                });
            });

            peer.on('error', (err) => {
                toggleButtons(false);
                if (err.type === 'unavailable-id') {
                    // ID가 중복되면 재시도
                    createRoom();
                } else {
                    alert('방 생성에 실패했습니다: ' + err.type);
                }
            });
        }

        // --- 방 참여하기 (Client) ---
        function joinRoom() {
            myName = document.getElementById('nickname').value.trim();
            if (!myName) return alert('닉네임을 입력하세요.');

            const code = document.getElementById('join-code').value.trim().toUpperCase();
            if (code.length !== 6) return alert('6자리 방 코드를 올바르게 입력하세요.');

            toggleButtons(true);
            resetPeer();
            isHost = false;
            
            peer = new Peer({ debug: 1 });

            peer.on('open', (id) => {
                myId = id;
                // 방장(Code) 서버로 데이터 채널 연결
                hostConn = peer.connect(code, { reliable: true });

                hostConn.on('open', () => {
                    // 연결 성공 시 참가 전송
                    hostConn.send({ type: 'JOIN', name: myName });
                });

                hostConn.on('data', (data) => handleClientData(data));
                
                hostConn.on('close', () => {
                    alert('방장과의 연결이 끊어졌습니다.');
                });

                hostConn.on('error', (err) => {
                    toggleButtons(false);
                    alert('연결 실패: ' + err);
                });
            });

            peer.on('error', (err) => {
                toggleButtons(false);
                if (err.type === 'peer-not-found') {
                    alert('존재하지 않는 방 코드입니다. 코드를 다시 확인해 주세요.');
                } else {
                    alert('연결 오류가 발생했습니다: ' + err.type);
                }
            });
        }

        // --- 호스트 데이터 처리 ---
        function handleHostData(conn, data) {
            if (data.type === 'JOIN') {
                const isDuplicateName = Object.values(players).some(p => p.name === data.name);
                
                if (isDuplicateName) {
                    conn.send({ type: 'REJECT', reason: '이미 존재하는 닉네임입니다.' });
                    setTimeout(() => conn.close(), 500);
                    return;
                }

                players[conn.peer] = { name: data.name, score: 0, drawing: null, votedFor: null };
                
                // 새로운 참가자 및 기존 참가자들에게 로비 업데이트
                broadcast({ type: 'LOBBY_UPDATE', players });
                updateLobbyUI();
            } else if (data.type === 'SUBMIT_DRAWING') {
                if (players[conn.peer]) players[conn.peer].drawing = data.image;
            } else if (data.type === 'SUBMIT_VOTE') {
                if (players[conn.peer] && data.targetId !== conn.peer) {
                    players[conn.peer].votedFor = data.targetId;
                }
            }
        }

        // --- 클라이언트 데이터 처리 ---
        function handleClientData(data) {
            if (data.type === 'REJECT') {
                alert(data.reason);
                toggleButtons(false);
                if (peer) peer.destroy();
            } else if (data.type === 'LOBBY_UPDATE') {
                players = data.players;
                document.getElementById('lobby-inputs').style.display = 'none';
                document.getElementById('room-info').style.display = 'block';
                document.getElementById('room-code-label').innerText = '대기실 접속됨';
                document.getElementById('display-code').innerText = '참여 완료';
                updateLobbyUI();
            } else if (data.type === 'ROUND_START') {
                showScreen('draw-screen');
                clearCanvas();
                document.getElementById('round-info').innerText = `${data.round} / 8 라운드`;
                document.getElementById('target-word').innerText = data.word;
            } else if (data.type === 'TIMER') {
                if (document.getElementById('draw-screen').classList.contains('active')) {
                    document.getElementById('draw-timer').innerText = data.time;
                    if (data.time === 1) sendDrawing();
                } else if (document.getElementById('vote-screen').classList.contains('active')) {
                    document.getElementById('vote-timer').innerText = data.time;
                }
            } else if (data.type === 'VOTE_START') {
                showVoteScreen(data.drawings);
            } else if (data.type === 'RESULT') {
                showResultScreen(data.winners, data.players);
            } else if (data.type === 'END') {
                showEndScreen(data.players);
            }
        }

        function broadcast(data) {
            conns.forEach(c => {
                if (c && c.open) c.send(data);
            });
        }

        function updateLobbyUI() {
            const list = document.getElementById('player-list');
            list.innerHTML = Object.values(players).map(p => `<li>👤 <b>${p.name}</b></li>`).join('');
        }

        // --- 게임 루프 (Host 제어) ---
        function hostStartGame() {
            currentRound = 0;
            for (let id in players) players[id].score = 0;
            hostNextRound();
        }

        function hostNextRound() {
            currentRound++;
            if (currentRound > 8) {
                broadcast({ type: 'END', players });
                showEndScreen(players);
                return;
            }

            currentWord = WORDS[Math.floor(Math.random() * WORDS.length)];
            for (let id in players) {
                players[id].drawing = null;
                players[id].votedFor = null;
            }

            const roundData = { type: 'ROUND_START', round: currentRound, word: currentWord };
            broadcast(roundData);
            handleClientData(roundData);

            let time = 30;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                time--;
                broadcast({ type: 'TIMER', time });
                handleClientData({ type: 'TIMER', time });

                if (time <= 0) {
                    clearInterval(timerInterval);
                    hostStartVote();
                }
            }, 1000);
        }

        function hostStartVote() {
            const drawings = {};
            for (let id in players) {
                drawings[id] = { name: players[id].name, image: players[id].drawing };
            }

            const voteData = { type: 'VOTE_START', drawings };
            broadcast(voteData);
            handleClientData(voteData);

            let time = 15;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                time--;
                broadcast({ type: 'TIMER', time });
                handleClientData({ type: 'TIMER', time });

                if (time <= 0) {
                    clearInterval(timerInterval);
                    hostCalcResult();
                }
            }, 1000);
        }

        function hostCalcResult() {
            const votes = {};
            for (let id in players) {
                const target = players[id].votedFor;
                if (target) votes[target] = (votes[target] || 0) + 1;
            }

            let max = 0;
            for (let t in votes) if (votes[t] > max) max = votes[t];

            let winners = [];
            if (max > 0) {
                for (let t in votes) {
                    if (votes[t] === max && players[t]) {
                        players[t].score += 1;
                        winners.push(players[t].name);
                    }
                }
            }

            const resultData = { type: 'RESULT', winners, players };
            broadcast(resultData);
            handleClientData(resultData);

            setTimeout(() => { hostNextRound(); }, 5000);
        }

        // --- Canvas 및 화면 제어 ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function sendDrawing() {
            const img = canvas.toDataURL('image/png');
            if (isHost) players[myId].drawing = img;
            else if (hostConn && hostConn.open) hostConn.send({ type: 'SUBMIT_DRAWING', image: img });
        }

        function showVoteScreen(drawings) {
            showScreen('vote-screen');
            const grid = document.getElementById('drawing-grid');
            grid.innerHTML = '';

            for (let id in drawings) {
                if (id === myId) continue;

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    document.querySelectorAll('.card').forEach(c => c.style.borderColor = '#eee');
                    card.style.borderColor = '#2ecc71';
                    if (isHost) players[myId].votedFor = id;
                    else if (hostConn && hostConn.open) hostConn.send({ type: 'SUBMIT_VOTE', targetId: id });
                };

                const img = document.createElement('img');
                img.src = drawings[id].image || '';
                const name = document.createElement('p');
                name.innerText = drawings[id].name;

                card.appendChild(img);
                card.appendChild(name);
                grid.appendChild(card);
            }
        }

        function showResultScreen(winners, playersData) {
            showScreen('result-screen');
            document.getElementById('winner-text').innerText = winners.length > 0 
                ? `🎉 승자: ${winners.join(', ')}` 
                : '득표자가 없습니다.';

            document.getElementById('score-board').innerHTML = Object.values(playersData)
                .sort((a,b) => b.score - a.score)
                .map(p => `<li>${p.name}: <b>${p.score}점</b></li>`).join('');
        }

        function showEndScreen(playersData) {
            showScreen('end-screen');
            document.getElementById('final-board').innerHTML = Object.values(playersData)
                .sort((a,b) => b.score - a.score)
                .map((p, i) => `<li>${i+1}위 - ${p.name}: <b>${p.score}점</b></li>`).join('');
        }
    </script>
</body>
</html>
