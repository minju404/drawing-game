<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멀티 캐치 드로잉</title>
    <!-- Firebase SDK (무료 실시간 데이터베이스) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f7f6; margin: 0; padding: 20px; }
        .screen { display: none; background: white; max-width: 550px; margin: 0 auto; padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .active { display: block; }
        canvas { border: 2px solid #333; background: white; cursor: crosshair; border-radius: 10px; touch-action: none; }
        .timer { font-size: 26px; font-weight: bold; color: #e74c3c; margin: 10px 0; }
        .word { font-size: 28px; color: #2ecc71; font-weight: bold; margin: 10px 0; }
        .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 15px; }
        .card { border: 3px solid #eee; padding: 10px; border-radius: 10px; cursor: pointer; background: #fff; transition: 0.2s; }
        .card:hover { border-color: #3498db; }
        .card img { width: 140px; height: 140px; background: #fafafa; border-radius: 5px; }
        button { padding: 12px 24px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        input { padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; outline: none; text-align: center; }
        .room-code { background: #eef2f5; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 26px; color: #2c3e50; letter-spacing: 4px; margin: 10px 0; cursor: pointer; }
        #status-msg { margin-top: 15px; font-weight: bold; color: #e67e22; min-height: 24px; }
    </style>
</head>
<body>

    <!-- 1. 대기실 -->
    <div id="lobby-screen" class="screen active">
        <h1>🎨 멀티 캐치 드로잉</h1>
        <p>설치 없이 브라우저에서 바로 즐기는 게임</p>
        <input type="text" id="nickname" placeholder="닉네임 입력"><br><br>
        
        <div id="action-buttons">
            <button id="create-btn" type="button" onclick="createRoom()">방 만들기 (방장)</button>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <input type="text" id="join-code" placeholder="6자리 방 코드 입력" maxlength="6" style="text-transform: uppercase;">
            <button id="join-btn" type="button" onclick="joinRoom()">참여하기</button>
        </div>

        <div id="status-msg"></div>

        <div id="room-info" style="display:none; margin-top: 20px;">
            <p id="code-label">친구에게 아래 코드를 전달하세요 (클릭시 복사):</p>
            <div class="room-code" id="display-code" onclick="copyCode()">------</div>
            <h3>참여 유저 목록</h3>
            <ul id="player-list" style="list-style:none; padding:0;"></ul>
            <button id="start-btn" type="button" onclick="hostStartGame()" style="display:none; background:#2ecc71;">게임 시작 (8라운드)</button>
        </div>
    </div>

    <!-- 2. 그림 그리기 -->
    <div id="draw-screen" class="screen">
        <h2 id="round-info">1 / 8 라운드</h2>
        <div class="timer">남은 시간: <span id="draw-timer">30</span>초</div>
        <div class="word">제시어: <span id="target-word">?</span></div>
        <canvas id="canvas" width="300" height="300"></canvas><br><br>
        <button type="button" onclick="clearCanvas()">지우기</button>
    </div>

    <!-- 3. 투표 -->
    <div id="vote-screen" class="screen">
        <h2>마음에 드는 그림에 투표하세요!</h2>
        <div class="timer">남은 시간: <span id="vote-timer">15</span>초</div>
        <div id="drawing-grid" class="grid"></div>
    </div>

    <!-- 4. 라운드 결과 -->
    <div id="result-screen" class="screen">
        <h2>라운드 결과</h2>
        <h3 id="winner-text" style="color: #e67e22;"></h3>
        <h3>현재 순위</h3>
        <ul id="score-board" style="list-style:none; padding:0;"></ul>
    </div>

    <!-- 5. 최종 승리 -->
    <div id="end-screen" class="screen">
        <h1>🏆 최종 결과 🏆</h1>
        <ul id="final-board" style="list-style:none; padding:0; font-size:20px;"></ul>
        <button type="button" onclick="location.reload()">처음으로</button>
    </div>

    <script>
        // 공개 무료 데이터베이스 설정
        const firebaseConfig = {
            databaseURL: "https://public-drawing-game-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const WORDS = ['사과', '바나나', '호랑이', '자동차', '비행기', '피자', '컴퓨터', '우주선', '안경', '축구공', '선글라스', '고양이'];
        let roomRef = null;
        let roomCode = '';
        let myId = 'u_' + Math.random().toString(36).substring(2, 9);
        let myName = '';
        let isHost = false;
        let timerInterval = null;

        function generateShortCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function setStatus(msg) {
            document.getElementById('status-msg').innerText = msg;
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function disableInputs() {
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('nickname').disabled = true;
        }

        function copyCode() {
            const code = document.getElementById('display-code').innerText;
            if (code && code !== '------') {
                navigator.clipboard.writeText(code);
                alert('방 코드가 복사되었습니다: ' + code);
            }
        }

        // --- 방 만들기 (Host) ---
        function createRoom() {
            myName = document.getElementById('nickname').value.trim() || '방장';
            isHost = true;
            disableInputs();

            roomCode = generateShortCode();
            roomRef = db.ref('rooms/' + roomCode);

            // 초기 방 정보 생성
            const initialData = {
                state: 'LOBBY',
                round: 0,
                word: '',
                timeLeft: 0,
                players: {}
            };
            initialData.players[myId] = { name: myName, score: 0, drawing: '', vote: '' };

            roomRef.set(initialData).then(() => {
                document.getElementById('display-code').innerText = roomCode;
                document.getElementById('room-info').style.display = 'block';
                document.getElementById('start-btn').style.display = 'inline-block';
                setStatus('방이 생성되었습니다.');
                listenRoomChanges();
            });

            // 창 닫을 때 유저 제거
            roomRef.child('players/' + myId).onDisconnect().remove();
        }

        // --- 방 참여하기 (Client) ---
        function joinRoom() {
            myName = document.getElementById('nickname').value.trim() || '게스트';
            roomCode = document.getElementById('join-code').value.trim().toUpperCase();
            
            if (!codeValidation(roomCode)) return;

            setStatus('방에 접속 중...');

            roomRef = db.ref('rooms/' + roomCode);

            roomRef.once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    setStatus('존재하지 않는 방 코드입니다.');
                    return;
                }

                disableInputs();
                
                // 내 정보 추가
                roomRef.child('players/' + myId).set({
                    name: myName,
                    score: 0,
                    drawing: '',
                    vote: ''
                }).then(() => {
                    document.getElementById('room-info').style.display = 'block';
                    document.getElementById('code-label').innerText = '접속 완료!';
                    document.getElementById('display-code').innerText = roomCode;
                    setStatus('');
                    listenRoomChanges();
                });

                roomRef.child('players/' + myId).onDisconnect().remove();
            });
        }

        function codeValidation(code) {
            if (!code || code.length !== 6) {
                alert('6자리 방 코드를 정확히 입력하세요.');
                return false;
            }
            return true;
        }

        // --- 데이터베이스 실시간 수신 ---
        function listenRoomChanges() {
            roomRef.on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return;

                // 유저 목록 업데이트
                if (data.players) {
                    updateLobbyUI(data.players);
                }

                // 화면 상태 변경 감지
                if (data.state === 'DRAWING' && !document.getElementById('draw-screen').classList.contains('active')) {
                    showScreen('draw-screen');
                    clearCanvas();
                    document.getElementById('round-info').innerText = `${data.round} / 8 라운드`;
                    document.getElementById('target-word').innerText = data.word;
                } else if (data.state === 'VOTING' && !document.getElementById('vote-screen').classList.contains('active')) {
                    showVoteScreen(data.players);
                } else if (data.state === 'RESULT' && !document.getElementById('result-screen').classList.contains('active')) {
                    showResultScreen(data.winners, data.players);
                } else if (data.state === 'END' && !document.getElementById('end-screen').classList.contains('active')) {
                    showEndScreen(data.players);
                }

                // 타이머 동기화
                if (data.state === 'DRAWING') {
                    document.getElementById('draw-timer').innerText = data.timeLeft;
                    if (data.timeLeft === 1) sendDrawing();
                } else if (data.state === 'VOTING') {
                    document.getElementById('vote-timer').innerText = data.timeLeft;
                }
            });
        }

        function updateLobbyUI(players) {
            const list = document.getElementById('player-list');
            list.innerHTML = Object.values(players).map(p => `<li><b>${p.name}</b></li>`).join('');
        }

        // --- 게임 루프 (Host 제어) ---
        function hostStartGame() {
            hostNextRound(1);
        }

        function hostNextRound(roundNum) {
            if (roundNum > 8) {
                roomRef.update({ state: 'END' });
                return;
            }

            const randomWord = WORDS[Math.floor(Math.random() * WORDS.length)];

            // 유저 선택/그림 초기화
            roomRef.child('players').once('value', snapshot => {
                const players = snapshot.val();
                for (let id in players) {
                    roomRef.child(`players/${id}`).update({ drawing: '', vote: '' });
                }
            });

            roomRef.update({
                state: 'DRAWING',
                round: roundNum,
                word: randomWord,
                timeLeft: 30
            });

            let time = 30;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                time--;
                roomRef.update({ timeLeft: time });

                if (time <= 0) {
                    clearInterval(timerInterval);
                    hostStartVote(roundNum);
                }
            }, 1000);
        }

        function hostStartVote(roundNum) {
            roomRef.update({
                state: 'VOTING',
                timeLeft: 15
            });

            let time = 15;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                time--;
                roomRef.update({ timeLeft: time });

                if (time <= 0) {
                    clearInterval(timerInterval);
                    hostCalcResult(roundNum);
                }
            }, 1000);
        }

        function hostCalcResult(roundNum) {
            roomRef.child('players').once('value', snapshot => {
                const players = snapshot.val() || {};
                const votes = {};

                for (let id in players) {
                    const target = players[id].vote;
                    if (target) votes[target] = (votes[target] || 0) + 1;
                }

                let max = 0;
                for (let t in votes) if (votes[t] > max) max = votes[t];

                let winners = [];
                if (max > 0) {
                    for (let t in votes) {
                        if (votes[t] === max && players[t]) {
                            players[t].score = (players[t].score || 0) + 1;
                            roomRef.child(`players/${t}/score`).set(players[t].score);
                            winners.push(players[t].name);
                        }
                    }
                }

                roomRef.update({
                    state: 'RESULT',
                    winners: winners
                });

                setTimeout(() => {
                    hostNextRound(roundNum + 1);
                }, 5000);
            });
        }

        // --- Canvas 및 기능 함수 ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', (e) => { drawing = true; draw(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener('touchend', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); e.preventDefault(); });

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function sendDrawing() {
            const img = canvas.toDataURL('image/png');
            roomRef.child(`players/${myId}/drawing`).set(img);
        }

        function showVoteScreen(players) {
            showScreen('vote-screen');
            const grid = document.getElementById('drawing-grid');
            grid.innerHTML = '';

            for (let id in players) {
                if (id === myId) continue;

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    document.querySelectorAll('.card').forEach(c => c.style.borderColor = '#eee');
                    card.style.borderColor = '#2ecc71';
                    roomRef.child(`players/${myId}/vote`).set(id);
                };

                const img = document.createElement('img');
                img.src = players[id].drawing || '';
                const name = document.createElement('p');
                name.innerText = players[id].name;

                card.appendChild(img);
                card.appendChild(name);
                grid.appendChild(card);
            }
        }

        function showResultScreen(winners, playersData) {
            showScreen('result-screen');
            const winnerArr = winners || [];
            document.getElementById('winner-text').innerText = winnerArr.length > 0 
                ? `🎉 승자: ${winnerArr.join(', ')}` 
                : '득표자가 없습니다.';

            document.getElementById('score-board').innerHTML = Object.values(playersData || {})
                .sort((a,b) => (b.score || 0) - (a.score || 0))
                .map(p => `<li>${p.name}: <b>${p.score || 0}점</b></li>`).join('');
        }

        function showEndScreen(playersData) {
            showScreen('end-screen');
            document.getElementById('final-board').innerHTML = Object.values(playersData || {})
                .sort((a,b) => (b.score || 0) - (a.score || 0))
                .map((p, i) => `<li>${i+1}위 - ${p.name}: <b>${p.score || 0}점</b></li>`).join('');
        }
    </script>
</body>
</html>
